<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matcha or train? A tiny game from Now Departing.">
    <title>Matcha or Train? - Now Departing</title>
    <meta property="og:title" content="Matcha or Train?" />
    <meta property="og:description" content="Every Brooklyn morning comes down to one decision at the top of the stairs. A tiny game from Now Departing." />
    <meta property="og:image" content="https://nowdeparting.app/img/og-image.png?v=2" />
    <meta property="og:url" content="https://nowdeparting.app/game/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        background: #000;
    }

    body {
        color: #fff;
        font-family: "Silkscreen", monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.25rem 1rem 2rem;
    }

    .px {
        font-family: "Silkscreen", monospace;
        font-weight: normal;
    }

    header {
        width: 100%;
        max-width: 960px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.25rem;
    }

    /* Like the logo: the text sits on the arrow's bottom edge and its cap height
       (about 0.72em in Helvetica Neue) matches the arrowhead, which spans
       y 46–176 of the arrow's 176. So a 20px cap height wants a 27px arrow. */
    .back {
        display: inline-flex;
        align-items: baseline;
        gap: 0.5rem;
        min-height: 44px;
        color: #fff;
        text-decoration: none;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: bold;
        font-size: 28px;
        line-height: 44px;
    }

    /* The logo's arrow; it swings round to point home on hover */
    .back svg {
        width: 27px;
        height: 27px;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .back:hover svg,
    .back:focus-visible svg {
        transform: rotate(135deg);
    }

    @media (prefers-reduced-motion: reduce) {
        .back svg {
            transition: none;
        }
    }

    .keys {
        font-size: 0.75rem;
        color: #8e8e93;
        text-align: right;
    }

    /* ---------- Pixel corners ----------
       No smooth curves: corners are cut in steps on the game's pixel grid
       (--pu, 4px at full size). Each list is how far each row in from the
       edge is inset, in pixels. Outlines are clipped too, so focus is shown
       with an inset ring instead. */

    .px-circle { clip-path: polygon(calc(100% - calc(3 * var(--pu))) 0, calc(100% - calc(3 * var(--pu))) var(--pu), calc(100% - calc(2 * var(--pu))) var(--pu), calc(100% - calc(2 * var(--pu))) calc(2 * var(--pu)), calc(100% - var(--pu)) calc(2 * var(--pu)), calc(100% - var(--pu)) calc(3 * var(--pu)), 100% calc(3 * var(--pu)), 100% calc(100% - calc(3 * var(--pu))), calc(100% - var(--pu)) calc(100% - calc(3 * var(--pu))), calc(100% - var(--pu)) calc(100% - calc(2 * var(--pu))), calc(100% - calc(2 * var(--pu))) calc(100% - calc(2 * var(--pu))), calc(100% - calc(2 * var(--pu))) calc(100% - var(--pu)), calc(100% - calc(3 * var(--pu))) calc(100% - var(--pu)), calc(100% - calc(3 * var(--pu))) 100%, calc(3 * var(--pu)) 100%, calc(3 * var(--pu)) calc(100% - var(--pu)), calc(2 * var(--pu)) calc(100% - var(--pu)), calc(2 * var(--pu)) calc(100% - calc(2 * var(--pu))), var(--pu) calc(100% - calc(2 * var(--pu))), var(--pu) calc(100% - calc(3 * var(--pu))), 0 calc(100% - calc(3 * var(--pu))), 0 calc(3 * var(--pu)), var(--pu) calc(3 * var(--pu)), var(--pu) calc(2 * var(--pu)), calc(2 * var(--pu)) calc(2 * var(--pu)), calc(2 * var(--pu)) var(--pu), calc(3 * var(--pu)) var(--pu), calc(3 * var(--pu)) 0); }

    kbd {
        --pu: 4px;
        display: inline-block;
        min-width: 1.6em;
        padding: 0.1em 0.4em;
        margin: 0 0.15em;
        background: #1c1c1e;
        box-shadow: inset 0 -2px 0 #000, inset 0 0 0 1px #3a3a3c;
        color: #fff;
        font: inherit;
        text-align: center;
    }

    .stage-wrap {
        --s: 1;
        width: calc(960px * var(--s));
        height: calc(600px * var(--s));
        --pu: calc(4px * var(--s));
        overflow: hidden;
    }

    .stage {
        position: relative;
        width: 960px;
        height: 600px;
        transform: scale(var(--s));
        transform-origin: 0 0;
    }

    .stage svg {
        display: block;
        shape-rendering: crispEdges;
    }

    .door {
        fill: #B3BAC0;
    }

    /* ---------- Time of day, from the player's clock ---------- */

    .sky1 { fill: #BFE3EE; }
    .sky2 { fill: #CDE8EA; }
    .sky3 { fill: #DCEFEF; }
    .sun-px { fill: #FFE070; }
    .cloud { fill: #fff; }
    .moon { fill: #FFF3D6; }
    .sun { transform: translate(130px, 13px); }

    /* Pixel dither where the sky bands meet, for the colorful skies */
    .dither { display: none; }
    #scene[data-time="sunrise"] .dither,
    #scene[data-time="sunset"] .dither { display: inline; }

    .night-only,
    .glow-evening,
    .glow-night {
        display: none;
    }

    #scene[data-time="sunrise"] .sky1 { fill: #9DBBDF; }
    #scene[data-time="sunrise"] .sky2 { fill: #F2C3AE; }
    #scene[data-time="sunrise"] .sky3 { fill: #FFDFA6; }
    #scene[data-time="sunrise"] .sun-px { fill: #FFB347; }
    #scene[data-time="sunrise"] .cloud { fill: #FFE3D6; }
    #scene[data-time="sunrise"] .sun { transform: translate(141px, 44px); }   /* rising between the subway globes */

    #scene[data-time="sunset"] .sky1 { fill: #4B4E8C; }
    #scene[data-time="sunset"] .sky2 { fill: #E07F6A; }
    #scene[data-time="sunset"] .sky3 { fill: #FFB45C; }
    #scene[data-time="sunset"] .sun-px { fill: #FF7A3D; }
    #scene[data-time="sunset"] .cloud { fill: #F4A483; }
    #scene[data-time="sunset"] .sun { transform: translate(141px, 50px); }
    #scene[data-time="sunset"] .glow-evening { display: inline; }

    #scene[data-time="night"] .sky1 { fill: #0A1826; }
    #scene[data-time="night"] .sky2 { fill: #0F2233; }
    #scene[data-time="night"] .sky3 { fill: #15304A; }
    #scene[data-time="night"] .sun,
    #scene[data-time="night"] .clouds { display: none; }
    #scene[data-time="night"] .night-only,
    #scene[data-time="night"] .glow-evening,
    #scene[data-time="night"] .glow-night { display: inline; }

    /* The street takes on the light; the station below keeps its own */
    #scene[data-time="sunrise"] #street,
    #scene[data-time="sunrise"] #pigeons { filter: url(#tint-sunrise); }
    #scene[data-time="sunset"] #street,
    #scene[data-time="sunset"] #pigeons { filter: url(#tint-sunset); }
    #scene[data-time="night"] #street,
    #scene[data-time="night"] #pigeons { filter: url(#tint-night); }

    /* ---------- Commuters: one is picked at random each visit ---------- */

    .char { display: none; }
    #person[data-char="0"] .char-0,
    #person[data-char="1"] .char-1,
    #person[data-char="2"] .char-2,
    #person[data-char="3"] .char-3,
    #person[data-char="4"] .char-4 { display: inline; }

    /* ---------- Pigeons ---------- */

    .pigeon > g { display: none; }
    .pigeon[data-frame="walk"] .pg-walk,
    .pigeon[data-frame="step"] .pg-step,
    .pigeon[data-frame="peck"] .pg-peck,
    .pigeon[data-frame="fly"] .pg-fly { display: inline; }

    .doors-open .door {
        fill: #1E1E1E;
    }

    #train {
        transform: translateX(260px);
    }

    #person {
        transition: opacity 0.4s;
    }

    .hud {
        position: absolute;
        top: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #000;
        --pu: 4px;
    }

    .hud-train {
        left: 16px;
        padding: 10px 18px 10px 10px;
    }

    .hud-train .bullet {
        width: 40px;
        height: 40px;
        --pu: 4px;
        background: #A6A8AB;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .hud-train .count {
        min-width: 84px;
        text-align: right;
        font-size: 28px;
    }

    .hud-matcha {
        right: 16px;
        padding: 14px 18px;
        font-size: 14px;
    }

    .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .overlay[hidden] {
        display: none;
    }

    .card {
        background: #000;
        --pu: 4px;
        padding: 32px 40px;
        max-width: 540px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
    }

    .card h1 {
        font-size: 40px;
        line-height: 1.1;
    }

    .card h2 {
        font-size: 30px;
    }

    .card p {
        font-size: 15px;
        line-height: 1.6;
        color: #d1d1d6;
    }

    .card .stars {
        font-size: 34px;
        letter-spacing: 6px;
        color: #FFE070;
    }

    /* Commuters collected: silhouettes until you make the train with matcha */
    .collection {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .collection-label {
        font-size: 12px;
        color: #a1a1a6;
    }

    .collection-slots {
        display: flex;
        gap: 8px;
    }

    .slot {
        --pu: 4px;
        width: 50px;
        height: 52px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 6px;
        background: #1c1c1e;
    }

    .slot svg {
        display: block;
        shape-rendering: crispEdges;
        filter: brightness(0) invert(0.28);
    }

    .slot.got svg {
        filter: none;
    }

    .slot.current {
        box-shadow: inset 0 0 0 4px #FFE070;
    }

    .slot.new svg {
        animation: collect 0.6s steps(4) both;
    }

    @keyframes collect {
        0% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0); }
    }

    .card-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px 20px;
    }

    .btn {
        font: 18px "Silkscreen", monospace;
        border: none;
        --pu: 4px;
        padding: 14px 24px;
        outline: none;
        min-height: 48px;
        cursor: pointer;
        color: #000;
        background: #fff;
        transition: transform 0.12s, opacity 0.2s;
    }

    .btn:hover:not(:disabled) {
        transform: translateY(-2px);
    }

    .btn:focus-visible {
        box-shadow: inset 0 0 0 4px #0A84FF;
    }

    .btn:disabled {
        opacity: 0.35;
        cursor: default;
    }

    .btn kbd {
        font-size: 12px;
        margin-left: 0.6em;
        background: rgba(0, 0, 0, 0.12);
        box-shadow: none;
        color: inherit;
    }

    .home-link {
        color: #8e8e93;
        font-size: 13px;
    }

    .home-link:hover {
        color: #fff;
    }

    .controls {
        width: 100%;
        max-width: 960px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        margin-top: 16px;
    }

    .controls .note {
        flex-grow: 1;
        text-align: right;
        font-size: 12px;
        color: #8e8e93;
    }

    /* Hold-to-walk pad */
    .pad {
        display: flex;
        gap: 10px;
    }

    .hold {
        min-width: 64px;
        font-size: 22px;
        padding: 12px 18px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }

    .hold.active {
        background: #FFE070;
        transform: translateY(2px);
    }

    @media (max-width: 640px) {
        .keys {
            display: none;
        }

        .pad {
            flex: 1 1 100%;
        }

        .hold {
            flex: 1;
            min-width: 0;
        }

        .controls .note {
            text-align: center;
        }

        .card {
            padding: 24px;
        }
    }
    </style>
</head>

            <button class="btn px px-r2 hold" data-dir="left" aria-label="Walk left">←</button>
            <button class="btn px px-r2 hold" data-dir="up" aria-label="Climb up">↑</button>
            <button class="btn px px-r2 hold" data-dir="down" aria-label="Head down to the subway">↓</button>
            <button class="btn px px-r2 hold" data-dir="right" aria-label="Walk right">→</button>
        </div>
        <div class="note">Hold to walk. Doors stay open for 3 seconds.</div>
    </div>

    <script>
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        var train = $('train'), person = $('person'), body = $('body'), idle = $('idle'), walkFrame = $('walk'), cupEl = $('cup');
        var bubble = $('bubble'), bubbleText = $('bubble-text'), count = $('count'), matchaLabel = $('matcha-label');

        // ---- Five commuters. A three-star round collects the one you're playing and
        //      moves on to the next; the collection is kept in this browser.
        //      ?commuter=1 (to 5) picks one to start with.
        var COMMUTERS = 5, STORE = 'nowdeparting.commuters';
        var collected = [];
        try { collected = JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { collected = []; }
        function isCollected(i) { return collected.indexOf(i) !== -1; }
        function saveCollected() {
            try { localStorage.setItem(STORE, JSON.stringify(collected)); } catch (e) { /* private mode: keep it for this visit */ }
        }
        function nextCommuter(from) {
            for (var k = 1; k <= COMMUTERS; k++) {
                var i = (from + k) % COMMUTERS;
                if (!isCollected(i)) return i;
            }
            return (from + 1) % COMMUTERS;   // all five collected: keep cycling
        }
        function randomCommuter() {
            var open = [];
            for (var i = 0; i < COMMUTERS; i++) if (!isCollected(i)) open.push(i);
            if (!open.length) open = [0, 1, 2, 3, 4];
            return open[Math.floor(Math.random() * open.length)];
        }

        var CHAR, CHAIR, SPRITE_W, WALK_SPEED, upNext = null;
        function setCommuter(i) {
            CHAR = i;
            CHAIR = i === 4;                      // rides the elevator, not the stairs
            SPRITE_W = CHAIR ? 10 : 8;
            WALK_SPEED = CHAIR ? 52 : 48;         // scene pixels per second
            person.setAttribute('data-char', i);
        }
        var picked = parseInt(new URLSearchParams(location.search).get('commuter'), 10);
        setCommuter(picked >= 1 && picked <= 5 ? picked - 1 : randomCommuter());
        var cabEl = $('cab');

        // ---- Fit the 960×600 stage to the window ----
        function fit() {
            var s = Math.min(1, (window.innerWidth - 32) / 960, Math.max(0.3, (window.innerHeight - 190) / 600));
            $('wrap').style.setProperty('--s', s);
            $('controls').style.maxWidth = (960 * s) + 'px';
        }
        window.addEventListener('resize', fit);
        fit();

        // ---- The block, in scene pixels (feet positions) ----
        var STREET_Y = 72, PLATFORM_Y = 130;
        var SHOP_DOOR = 42;                       // stand at x ≤ this to order
        var STAIRS_TOP = { x: 140, y: 73 }, STAIRS_FOOT = { x: 191, y: 125 }, LANDING = { x: 191, y: 130 };
        var FLIGHT = Math.hypot(STAIRS_FOOT.x - STAIRS_TOP.x, STAIRS_FOOT.y - STAIRS_TOP.y);
        var STAIRS_LEN = FLIGHT + (LANDING.y - STAIRS_FOOT.y);
        var DOORS = [57, 87, 157, 187];           // door centers when the train is in
        var STAIRS_SPEED = 60;                    // scene pixels per second
        var ELEV_X = 220, ELEV_LEN = PLATFORM_Y - STREET_Y, ELEV_SPEED = 30;

        // ---- Game state ----
        var s, timers = [];

        function fresh(phase) {
            return {
                phase: phase, t: 8, train: 'away', onboard: false, hasMatcha: false,
                where: 'street', x: 100, d: 0, cab: 0, facing: 1, walking: false, anim: 0,
                brew: 0, brewNeed: 1.8 + Math.random() * 2.2, note: '', noteUntil: 0, missed: ''
            };
        }

        function clear() {
            timers.forEach(function (id) { clearTimeout(id); clearInterval(id); });
            timers = [];
        }

        // Where the commuter's feet are, for drawing and for the pigeons
        function personAt() {
            if (!s) return { x: 100, y: STREET_Y };
            if (s.where === 'street') return { x: s.x, y: STREET_Y };
            if (s.where === 'platform') return { x: s.x, y: PLATFORM_Y };
            if (s.where === 'elevator') return { x: ELEV_X, y: STREET_Y + s.d };
            if (s.d <= FLIGHT) {
                var k = s.d / FLIGHT;
                return { x: STAIRS_TOP.x + (STAIRS_FOOT.x - STAIRS_TOP.x) * k, y: STAIRS_TOP.y + (STAIRS_FOOT.y - STAIRS_TOP.y) * k };
            }
            return { x: STAIRS_FOOT.x, y: STAIRS_FOOT.y + (s.d - FLIGHT) };
        }

        function moveTrain(x, dur, ease) {
            train.style.transition = dur ? 'transform ' + dur + 's ' + ease : 'none';
            train.style.transform = 'translateX(' + x + 'px)';
        }

        function say(text, seconds) {
            s.note = text;
            s.noteUntil = performance.now() + seconds * 1000;
        }

        var shownBubble = null;
        function drawPerson() {
            var p = personAt();
            person.style.transform = 'translate(' + (p.x - SPRITE_W / 2) + 'px, ' + (p.y - 12) + 'px)';
            body.style.transform = s.facing < 0 ? 'translate(' + SPRITE_W + 'px, 0) scale(-1, 1)' : '';
            if (s.where === 'elevator') s.cab = s.d;
            cabEl.style.transform = 'translateY(' + s.cab + 'px)';
            var step = s.walking && Math.floor(s.anim / 0.17) % 2 === 1;
            idle.setAttribute('opacity', step ? 0 : 1);
            walkFrame.setAttribute('opacity', step ? 1 : 0);

            // What the commuter is saying
            var text = '';
            if (performance.now() < s.noteUntil) text = s.note;
            else if (s.missed) text = s.missed;
            else if (s.brew > 0) text = 'BREWING...';
            else if (s.phase === 'playing' && s.where === 'platform' && !s.walking && s.train !== 'stopped') text = 'WAITING...';
            if (text !== shownBubble) {
                shownBubble = text;
                bubbleText.textContent = text;
                bubble.setAttribute('opacity', text ? 1 : 0);
            }
        }

        function render() {
            var t = s.t;
            count.textContent = t > 0 ? t + 's' : (t > -3 ? 'Now' : 'Gone');
            count.style.color = t > 0 ? '#fff' : (t > -3 ? '#01EC76' : '#8e8e93');
            matchaLabel.textContent = s.hasMatcha ? 'In hand' : (s.brew > 0 ? 'Brewing' : 'None yet');
            matchaLabel.style.color = s.hasMatcha ? '#01EC76' : '#fff';
            cupEl.setAttribute('opacity', s.hasMatcha ? 1 : 0);
            train.classList.toggle('doors-open', s.train === 'stopped');
        }

        function reset(phase) {
            clear();
            s = fresh(phase);
            person.style.transition = 'opacity 0.4s';
            person.style.opacity = 1;
            moveTrain(260, 0);
            $('done').hidden = true;
            $('start').hidden = phase !== 'ready';
            drawPerson();
            render();
        }

        function start() {
            if (upNext !== null) { setCommuter(upNext); upNext = null; }
            reset('playing');
            timers.push(setInterval(tick, 1000));
        }

        function tick() {
            if (s.phase !== 'playing') return;
            s.t -= 1;
            if (s.t === 2) { s.train = 'arriving'; moveTrain(22, 2, 'ease-out'); }
            if (s.t === 0) s.train = 'stopped';
            if (s.t === -3) {
                s.train = 'gone';
                moveTrain(-240, 2, 'ease-in');
                if (!s.onboard) s.missed = s.where === 'platform' ? 'NOOO!' : 'MISSED IT';
            }
            if (s.t === -5) { finish(); return; }
            render();
        }

        function board(doorX) {
            s.onboard = true;
            s.x = doorX;
            s.walking = false;
            person.style.opacity = 0;
        }

        // ---- Holding a direction walks; letting go stops ----
        var keyHeld = {}, padHeld = {};
        function held(dir) { return !!(keyHeld[dir] || padHeld[dir]); }

        function toward(target, dt) {
            var step = WALK_SPEED * dt;
            if (Math.abs(target - s.x) <= step) { s.x = target; return true; }
            s.facing = target > s.x ? 1 : -1;
            s.x += s.facing * step;
            return false;
        }

        function update(dt) {
            if (s.phase !== 'playing' || s.onboard) { s.walking = false; return; }
            var L = held('left'), R = held('right'), U = held('up'), D = held('down');
            var before = personAt();

            if (s.where === 'street') {
                if (D && CHAIR) {
                    if (toward(ELEV_X, dt)) { s.where = 'elevator'; s.d = s.cab; }
                } else if (D) {
                    if (toward(STAIRS_TOP.x, dt)) { s.where = 'stairs'; s.d = 0; }
                } else if (L !== R) {
                    s.facing = R ? 1 : -1;
                    s.x = Math.max(6, Math.min(230, s.x + s.facing * WALK_SPEED * dt));
                }
            } else if (s.where === 'stairs') {
                var v = (D || R ? 1 : 0) - (U || L ? 1 : 0);
                if (v) {
                    s.facing = v;
                    s.d += v * STAIRS_SPEED * dt;
                    if (s.d <= 0) { s.where = 'street'; s.x = STAIRS_TOP.x; }
                    else if (s.d >= STAIRS_LEN) { s.where = 'platform'; s.x = LANDING.x; }
                }
            } else if (s.where === 'elevator') {
                var e = (D ? 1 : 0) - (U ? 1 : 0);
                s.d += e * ELEV_SPEED * dt;
                if (s.d <= 0) { s.d = 0; if (U) { s.where = 'street'; s.x = ELEV_X; } }
                else if (s.d >= ELEV_LEN) { s.d = ELEV_LEN; if (D) { s.where = 'platform'; s.x = ELEV_X; } }
                s.cab = s.d;
                if (L !== R && (s.d === 0 || s.d === ELEV_LEN)) {   // step out either end
                    s.where = s.d === 0 ? 'street' : 'platform';
                    s.x = ELEV_X;
                }
            } else {
                if (U && CHAIR) {
                    if (toward(ELEV_X, dt)) { s.where = 'elevator'; s.d = ELEV_LEN; }
                } else if (U) {
                    if (toward(LANDING.x, dt)) { s.where = 'stairs'; s.d = STAIRS_LEN; }
                } else if (L !== R) {
                    s.facing = R ? 1 : -1;
                    s.x = Math.max(6, Math.min(232, s.x + s.facing * WALK_SPEED * dt));
                }
            }

            var after = personAt();
            s.walking = after.x !== before.x || after.y !== before.y;
            if (s.walking) s.anim += dt;

            // Ordering: stand at the shop door until it's brewed
            if (s.where === 'street' && s.x <= SHOP_DOOR && !s.hasMatcha) {
                s.brew += dt;
                if (s.brew >= s.brewNeed) {
                    s.hasMatcha = true;
                    s.brew = 0;
                    say('MATCHA!', 1.2);
                }
            } else {
                s.brew = 0;
            }

            // Boarding: stand by any door while the train is in
            if (s.where === 'platform' && s.train === 'stopped') {
                for (var i = 0; i < DOORS.length; i++) {
                    if (Math.abs(s.x - DOORS[i]) <= 6) { board(DOORS[i]); break; }
                }
            }
            render();
        }

        var lastFrame = performance.now();
        (function loop(now) {
            var dt = Math.min(0.05, (now - lastFrame) / 1000);
            lastFrame = now;
            if (s) {
                update(dt);
                drawPerson();
            }
            requestAnimationFrame(loop);
        })(lastFrame);

        function finish() {
            s.phase = 'done';
            s.brew = 0;
            clear();
            render();
            var r;
            var perfect = s.onboard && s.hasMatcha, gotNew = perfect && !isCollected(CHAR);
            if (gotNew) { collected.push(CHAR); saveCollected(); }
            if (perfect) {
                upNext = nextCommuter(CHAR);
                r = ['★★★', 'Perfect commute', collected.length === COMMUTERS
                    ? (gotNew ? 'All five commuters made their train, matcha in hand. Brooklyn thanks you.' : 'Matcha in hand, doors closing behind you.')
                    : 'Matcha in hand, doors closing behind you. Commuter collected!'];
            }
            else if (s.onboard) r = ['★★☆', 'Made it!', 'On time. Matcha-less, but on time.'];
            else if (s.hasMatcha) r = ['★☆☆', 'Missed the L', 'At least the matcha is good. Next L in 6 min.'];
            else r = ['☆☆☆', 'No train, no matcha', 'Should have checked Now Departing.'];
            $('stars').textContent = r[0];
            $('result-title').textContent = r[1];
            $('result-line').textContent = r[2];
            $('again-label').textContent = perfect ? 'Next commuter' : 'Play again';
            $('collection-label').textContent = 'Commuters ' + collected.length + '/' + COMMUTERS;
            Array.prototype.forEach.call(document.querySelectorAll('.slot'), function (slot) {
                var i = +slot.getAttribute('data-i');
                slot.classList.toggle('got', isCollected(i));
                slot.classList.toggle('current', i === CHAR);
                slot.classList.toggle('new', gotNew && i === CHAR);
            });
            $('done').hidden = false;
            $('again-btn').focus({ preventScroll: true });
        }

        $('start-btn').addEventListener('click', start);
        $('again-btn').addEventListener('click', start);

        var KEYS = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
                     ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
        document.addEventListener('keydown', function (e) {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            var dir = KEYS[e.key];
            if (dir) {
                e.preventDefault();
                keyHeld[dir] = true;
                if (s.phase === 'ready') start();
            } else if (e.key === ' ' || e.key === 'Enter') {
                if (s.phase !== 'playing') { e.preventDefault(); start(); }
            }
        });
        document.addEventListener('keyup', function (e) {
            var dir = KEYS[e.key];
            if (dir) keyHeld[dir] = false;
            // Shift or caps can change "s" to "S" mid-hold
            if (dir && e.key.length === 1) { keyHeld[dir] = false; }
        });
        window.addEventListener('blur', function () { keyHeld = {}; padHeld = {}; });

        // The on-screen pad, for touch: hold a button to walk
        Array.prototype.forEach.call(document.querySelectorAll('.hold'), function (btn) {
            var dir = btn.getAttribute('data-dir');
            function down(e) {
                e.preventDefault();
                if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
                padHeld[dir] = true;
                btn.classList.add('active');
                if (s.phase === 'ready') start();
            }
            function up() {
                padHeld[dir] = false;
                btn.classList.remove('active');
            }
            btn.addEventListener('pointerdown', down);
            btn.addEventListener('pointerup', up);
            btn.addEventListener('pointercancel', up);
            btn.addEventListener('lostpointercapture', up);
            btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        });

        reset('ready');
        $('start-btn').focus({ preventScroll: true });

        // ---- Time of day: sunrise, day, sunset or night, from the local clock.
        //      ?time=night (or sunrise, day, sunset) previews one.
        var scene = $('scene');
        var forced = new URLSearchParams(location.search).get('time');
        function timeOfDay(d) {
            var h = d.getHours() + d.getMinutes() / 60;
            if (h >= 5.5 && h < 8) return 'sunrise';
            if (h >= 8 && h < 17.5) return 'day';
            if (h >= 17.5 && h < 20) return 'sunset';
            return 'night';
        }
        function applyTime() {
            var t = /^(sunrise|day|sunset|night)$/.test(forced) ? forced : timeOfDay(new Date());
            scene.setAttribute('data-time', t);
        }
        applyTime();
        setInterval(applyTime, 60000);

        // ---- Moon: tonight's real phase, drawn pixel by pixel on a 10-pixel disc.
        //      ?moon=0.25 previews one (0 new, 0.25 first quarter, 0.5 full, 0.75 last quarter).
        function moonPhase(d) {
            var SYNODIC = 29.530588853;                      // days from new moon to new moon
            var NEW_MOON = Date.UTC(2000, 0, 6, 18, 14);     // a known new moon
            var p = ((d - NEW_MOON) / 86400000 / SYNODIC) % 1;
            return p < 0 ? p + 1 : p;
        }
        function drawMoon(phase) {
            var g = $('moon'), NS = 'http://www.w3.org/2000/svg', RADIUS = 5;
            while (g.firstChild) g.removeChild(g.firstChild);
            var c = Math.cos(2 * Math.PI * phase);
            for (var y = -RADIUS; y < RADIUS; y++) {
                for (var x = -RADIUS; x < RADIUS; x++) {
                    var u = (x + 0.5) / RADIUS, v = (y + 0.5) / RADIUS;
                    if (u * u + v * v > 1) continue;
                    var edge = Math.sqrt(1 - v * v);
                    // Waxing moons are lit on the right, waning on the left (as seen from New York)
                    var lit = phase < 0.5 ? u > edge * c : u < -edge * c;
                    var px = document.createElementNS(NS, 'rect');
                    px.setAttribute('x', x); px.setAttribute('y', y);
                    px.setAttribute('width', 1); px.setAttribute('height', 1);
                    if (lit) px.setAttribute('class', 'moon');
                    else px.setAttribute('fill', '#1F3447');
                    g.appendChild(px);
                }
            }
        }
        var forcedMoon = parseFloat(new URLSearchParams(location.search).get('moon'));
        function applyMoon() { drawMoon(forcedMoon >= 0 && forcedMoon <= 1 ? forcedMoon : moonPhase(Date.now())); }
        applyMoon();
        setInterval(applyMoon, 3600000);

        // ---- Pigeons: wander the sidewalk, peck, and scatter when the commuter comes near
        var birds = [
            { el: $('pigeon0'), x: 58, y: 66, dir: 1, mode: 'peck', t: 1.5, anim: 0, target: 58 },
            { el: $('pigeon1'), x: 200, y: 66, dir: -1, mode: 'walk', t: 0, anim: 0, target: 176 }
        ];
        function wander(b) {
            var step = (Math.random() < 0.5 ? -1 : 1) * (15 + Math.random() * 50);
            b.target = Math.max(6, Math.min(226, b.x + step));
            b.dir = b.target >= b.x ? 1 : -1;
            b.mode = 'walk';
        }
        function draw(b, frame) {
            b.el.setAttribute('data-frame', frame);
            b.el.style.transform = 'translate(' + (b.dir < 0 ? b.x + 8 : b.x) + 'px, ' + b.y + 'px) scale(' + b.dir + ', 1)';
        }
        function updateBird(b, dt) {
            var p = personAt();
            var near = person.style.opacity !== '0' && p.y < 80 && Math.abs(p.x - (b.x + 4)) < 16;
            if (near && (b.mode === 'walk' || b.mode === 'peck')) {
                b.mode = 'fly';
                b.dir = p.x < b.x + 4 ? 1 : -1;
                b.vx = b.dir * (34 + Math.random() * 10);
                b.vy = -26 - Math.random() * 8;
            }
            b.anim += dt;
            if (b.mode === 'walk') {
                b.x += b.dir * 7 * dt;
                if (b.dir > 0 ? b.x >= b.target : b.x <= b.target) {
                    b.mode = 'peck';
                    b.t = 0.8 + Math.random() * 1.8;
                }
                draw(b, Math.floor(b.anim / 0.18) % 2 ? 'step' : 'walk');
            } else if (b.mode === 'peck') {
                b.t -= dt;
                if (b.t <= 0) wander(b);
                draw(b, Math.floor(b.anim / 0.3) % 2 ? 'peck' : 'walk');
            } else if (b.mode === 'fly') {
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                if (b.y < -10 || b.x < -12 || b.x > 252) {
                    b.mode = 'gone';
                    b.t = 5 + Math.random() * 5;
                }
                draw(b, Math.floor(b.anim / 0.09) % 2 ? 'fly' : 'walk');
            } else {
                b.t -= dt;
                if (b.t <= 0) {   // a new pigeon wanders in from one side
                    var left = Math.random() < 0.5;
                    b.x = left ? -8 : 248;
                    b.y = 66;
                    b.target = 20 + Math.random() * 200;
                    b.dir = left ? 1 : -1;
                    b.mode = 'walk';
                }
            }
        }
        birds.forEach(function (b) { draw(b, 'walk'); });
        if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
            var last = performance.now();
            (function frame(now) {
                var dt = Math.min(0.05, (now - last) / 1000);
                last = now;
                birds.forEach(function (b) { updateBird(b, dt); });
                requestAnimationFrame(frame);
            })(last);
        }
    })();
    </script>
</body>

</html>
