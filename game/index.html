<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matcha or train? A tiny game from Now Departing.">
    <title>Matcha or Train? - Now Departing</title>
    <meta property="og:title" content="Matcha or Train?" />
    <meta property="og:description" content="Every Brooklyn morning comes down to one decision at the top of the stairs. A tiny game from Now Departing." />
    <meta property="og:image" content="https://nowdeparting.app/img/og-image.png" />
    <meta property="og:url" content="https://nowdeparting.app/game/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        background: #000;
    }

    body {
        color: #fff;
        font-family: "Silkscreen", monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.25rem 1rem 2rem;
    }

    .px {
        font-family: "Silkscreen", monospace;
        font-weight: normal;
    }

    header {
        width: 100%;
        max-width: 960px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.25rem;
    }

    /* Like the logo: the text sits on the arrow's bottom edge and its cap height
       (about 0.72em in Helvetica Neue) matches the arrowhead, which spans
       y 46–176 of the arrow's 176. So a 20px cap height wants a 27px arrow. */
    .back {
        display: inline-flex;
        align-items: baseline;
        gap: 0.5rem;
        min-height: 44px;
        color: #fff;
        text-decoration: none;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: bold;
        font-size: 28px;
        line-height: 44px;
    }

    /* The logo's arrow; it swings round to point home on hover */
    .back svg {
        width: 27px;
        height: 27px;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .back:hover svg,
    .back:focus-visible svg {
        transform: rotate(135deg);
    }

    @media (prefers-reduced-motion: reduce) {
        .back svg {
            transition: none;
        }
    }

    .keys {
        font-size: 0.75rem;
        color: #8e8e93;
        text-align: right;
    }

    kbd {
        display: inline-block;
        min-width: 1.6em;
        padding: 0.1em 0.4em;
        margin: 0 0.15em;
        border-radius: 5px;
        background: #1c1c1e;
        box-shadow: inset 0 -2px 0 #000, inset 0 0 0 1px #3a3a3c;
        color: #fff;
        font: inherit;
        text-align: center;
    }

    .stage-wrap {
        --s: 1;
        width: calc(960px * var(--s));
        height: calc(600px * var(--s));
        border-radius: calc(20px * var(--s));
        overflow: hidden;
        box-shadow: 0 0 0 1px #2c2c2e;
    }

    .stage {
        position: relative;
        width: 960px;
        height: 600px;
        transform: scale(var(--s));
        transform-origin: 0 0;
    }

    .stage svg {
        display: block;
        shape-rendering: crispEdges;
    }

    .door {
        fill: #B3BAC0;
    }

    .doors-open .door {
        fill: #1E1E1E;
    }

    #train {
        transform: translateX(260px);
    }

    #person {
        transition: opacity 0.4s;
    }

    .hud {
        position: absolute;
        top: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #000;
        border-radius: 18px;
    }

    .hud-train {
        left: 16px;
        padding: 10px 18px 10px 10px;
    }

    .hud-train .bullet {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #A6A8AB;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .hud-train .count {
        min-width: 84px;
        text-align: right;
        font-size: 28px;
    }

    .hud-matcha {
        right: 16px;
        padding: 14px 18px;
        font-size: 14px;
    }

    .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .overlay[hidden] {
        display: none;
    }

    .card {
        background: #000;
        border-radius: 24px;
        padding: 32px 40px;
        max-width: 540px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
    }

    .card h1 {
        font-size: 40px;
        line-height: 1.1;
    }

    .card h2 {
        font-size: 30px;
    }

    .card p {
        font-size: 15px;
        line-height: 1.6;
        color: #d1d1d6;
    }

    .card .stars {
        font-size: 34px;
        letter-spacing: 6px;
        color: #FFE070;
    }

    .card-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px 20px;
    }

    .btn {
        font: 18px "Silkscreen", monospace;
        border: none;
        border-radius: 14px;
        padding: 14px 24px;
        min-height: 48px;
        cursor: pointer;
        color: #000;
        background: #fff;
        transition: transform 0.12s, opacity 0.2s;
    }

    .btn:hover:not(:disabled) {
        transform: translateY(-2px);
    }

    .btn:disabled {
        opacity: 0.35;
        cursor: default;
    }

    .btn kbd {
        font-size: 12px;
        margin-left: 0.6em;
        background: rgba(0, 0, 0, 0.12);
        box-shadow: none;
        color: inherit;
    }

    .home-link {
        color: #8e8e93;
        font-size: 13px;
    }

    .home-link:hover {
        color: #fff;
    }

    .controls {
        width: 100%;
        max-width: 960px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        margin-top: 16px;
    }

    .controls .note {
        flex-grow: 1;
        text-align: right;
        font-size: 12px;
        color: #8e8e93;
    }

    .matcha-btn {
        background: #01EC76;
    }

    .train-btn {
        background: #FFE070;
    }

    @media (max-width: 640px) {
        .keys {
            display: none;
        }

        .controls .btn {
            flex: 1 1 40%;
        }

        .controls .note {
            text-align: center;
        }

        .card {
            padding: 24px;
        }
    }
    </style>
</head>

    <script>
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        var train = $('train'), person = $('person'), idle = $('idle'), walkFrame = $('walk'), cupEl = $('cup');
        var bubble = $('bubble'), bubbleText = $('bubble-text'), count = $('count'), matchaLabel = $('matcha-label');
        var matchaBtn = $('matcha-btn'), trainBtn = $('train-btn');

        // ---- Fit the 960×600 stage to the window ----
        function fit() {
            var s = Math.min(1, (window.innerWidth - 32) / 960, Math.max(0.3, (window.innerHeight - 190) / 600));
            $('wrap').style.setProperty('--s', s);
            $('controls').style.maxWidth = (960 * s) + 'px';
        }
        window.addEventListener('resize', fit);
        fit();

        // ---- Game state ----
        var s, timers = [];

        function fresh(phase) {
            return { phase: phase, t: 8, pos: 'corner', busy: false, hasMatcha: false, train: 'away', onboard: false, walking: false, frame: 0 };
        }

        function clear() {
            timers.forEach(function (id) { clearTimeout(id); clearInterval(id); });
            timers = [];
        }

        function later(ms, fn) {
            timers.push(setTimeout(function () { if (s.phase === 'playing') fn(); }, ms));
        }

        function setBubble(text) {
            bubbleText.textContent = text;
            bubble.setAttribute('opacity', text ? 1 : 0);
        }

        function place(fx, fy, dur) {
            person.style.transition = 'transform ' + dur + 's linear, opacity 0.4s';
            person.style.transform = 'translate(' + (fx - 4) + 'px, ' + (fy - 12) + 'px)';
        }

        function moveTrain(x, dur, ease) {
            train.style.transition = dur ? 'transform ' + dur + 's ' + ease : 'none';
            train.style.transform = 'translateX(' + x + 'px)';
        }

        function render() {
            var t = s.t;
            count.textContent = t > 0 ? t + 's' : (t > -3 ? 'Now' : 'Gone');
            count.style.color = t > 0 ? '#fff' : (t > -3 ? '#01EC76' : '#8e8e93');
            matchaLabel.textContent = s.hasMatcha ? 'In hand' : (bubbleText.textContent === 'BREWING...' ? 'Brewing' : 'None yet');
            matchaLabel.style.color = s.hasMatcha ? '#01EC76' : '#fff';
            cupEl.setAttribute('opacity', s.hasMatcha ? 1 : 0);
            var playing = s.phase === 'playing';
            matchaBtn.disabled = !(playing && !s.busy && s.pos === 'corner' && !s.hasMatcha);
            trainBtn.disabled = !(playing && !s.busy && s.pos === 'corner');
            train.classList.toggle('doors-open', s.train === 'stopped');
        }

        function reset(phase) {
            clear();
            s = fresh(phase);
            person.style.opacity = 1;
            place(100, 72, 0);
            moveTrain(260, 0);
            setBubble('');
            $('done').hidden = true;
            $('start').hidden = phase !== 'ready';
            render();
        }

        function start() {
            reset('playing');
            timers.push(setInterval(tick, 1000));
            timers.push(setInterval(function () {
                var w = s.walking && s.frame === 0;
                s.frame = s.walking ? 1 - s.frame : 0;
                idle.setAttribute('opacity', w ? 0 : 1);
                walkFrame.setAttribute('opacity', w ? 1 : 0);
            }, 170));
        }

        function tick() {
            if (s.phase !== 'playing') return;
            s.t -= 1;
            if (s.t === 2) { s.train = 'arriving'; moveTrain(22, 2, 'ease-out'); }
            if (s.t === 0) {
                s.train = 'stopped';
                if (s.pos === 'platform' && !s.onboard) board();
            }
            if (s.t === -3) {
                s.train = 'gone';
                moveTrain(-240, 2, 'ease-in');
                if (!s.onboard) setBubble(s.pos === 'platform' ? 'NOOO!' : 'MISSED IT');
            }
            if (s.t === -5) { finish(); return; }
            render();
        }

        function walk(fx, fy, dur, then) {
            s.walking = true;
            place(fx, fy, dur);
            later(dur * 1000, function () {
                s.walking = false;
                idle.setAttribute('opacity', 1);
                walkFrame.setAttribute('opacity', 0);
                if (then) then();
            });
        }

        function goMatcha() {
            if (s.phase !== 'playing' || s.busy || s.pos !== 'corner' || s.hasMatcha) return;
            var brew = 1800 + Math.round(Math.random() * 2200);
            s.busy = true; s.pos = 'shop';
            setBubble('');
            render();
            walk(36, 72, 1.1, function () {
                setBubble('BREWING...');
                render();
                later(brew, function () {
                    s.hasMatcha = true;
                    setBubble('MATCHA!');
                    render();
                    walk(100, 72, 1.1, function () {
                        s.busy = false; s.pos = 'corner';
                        setBubble('');
                        render();
                    });
                });
            });
        }

        function goTrain() {
            if (s.phase !== 'playing' || s.busy || s.pos !== 'corner') return;
            s.busy = true; s.pos = 'stairs';
            setBubble('');
            render();
            walk(140, 73, 0.7, function () {
                walk(191, 125, 1.3, function () {
                    walk(172, 130, 0.4, function () {
                        s.pos = 'platform';
                        if (s.train === 'stopped') board();
                        else setBubble(s.train === 'gone' ? 'NEXT L: 6 MIN' : 'WAITING...');
                        render();
                    });
                });
            });
        }

        function board() {
            s.onboard = true;
            setBubble('');
            walk(157, 130, 0.3, function () { person.style.opacity = 0; });
        }

        function finish() {
            s.phase = 'done';
            clear();
            render();
            var r;
            if (s.onboard && s.hasMatcha) r = ['★★★', 'Perfect commute', 'Matcha in hand, doors closing behind you.'];
            else if (s.onboard) r = ['★★☆', 'Made it!', 'On time. Matcha-less, but on time.'];
            else if (s.hasMatcha) r = ['★☆☆', 'Missed the L', 'At least the matcha is good. Next L in 6 min.'];
            else r = ['☆☆☆', 'No train, no matcha', 'Should have checked Now Departing.'];
            $('stars').textContent = r[0];
            $('result-title').textContent = r[1];
            $('result-line').textContent = r[2];
            $('done').hidden = false;
            $('again-btn').focus({ preventScroll: true });
        }

        $('start-btn').addEventListener('click', start);
        $('again-btn').addEventListener('click', start);
        matchaBtn.addEventListener('click', goMatcha);
        trainBtn.addEventListener('click', goTrain);

        document.addEventListener('keydown', function (e) {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            var k = e.key;
            if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); goMatcha(); }
            else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); goTrain(); }
            else if (k === ' ' || k === 'Enter') {
                if (s.phase !== 'playing') { e.preventDefault(); start(); }
            }
        });

        reset('ready');
        $('start-btn').focus({ preventScroll: true });
    })();
    </script>
</body>

</html>
